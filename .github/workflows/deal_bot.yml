name: deal-bot

"on":
  push:
  pull_request:
  workflow_dispatch: {}
  # The 4-hour schedule is owned by the always-on Discord bot service
  # (`python -m deal_bot --bot`). This workflow is CI (unit tests) only.
  # schedule:
  #   - cron: "0 */4 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py"

      # Production `python -m deal_bot` step removed: the always-on bot
      # service now owns the 4-hour cadence. Running it here would
      # duplicate posts. This workflow stays as CI.
